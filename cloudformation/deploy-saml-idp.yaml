AWSTemplateFormatVersion: '2010-09-09'
Description: 'SAML Identity Provider - Deploys the IAM SAML Provider trust anchor for Central SAML IdP'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Configuration"
        Parameters:
          - EnvironmentName
          - SAMLMetadata
    ParameterLabels:
      EnvironmentName:
        default: "Environment Name"
      SAMLMetadata:
        default: "IDP Metadata XML"

Parameters:
  EnvironmentName:
    Type: String
    Description: Environment name (e.g., dev, prod) to be appended to the provider name. The provider will be named CentralSAMLIdP-{EnvironmentName}.
    Default: dev
    AllowedPattern: ^[a-zA-Z0-9-]+$
    ConstraintDescription: Must be alphanumeric with hyphens only
    
  SAMLMetadata:
    Type: String
    Description: The XML metadata document from the Simple SAML IdP. Copy the content from saml-metadata.xml and paste it here.
    MinLength: 1
    # CloudFormation parameter max size is 4096 bytes. Standard SAML metadata usually fits.

Resources:
  SAMLProvider:
    Type: AWS::IAM::SAMLProvider
    Properties:
      Name: !Sub "CentralSAMLIdP-${EnvironmentName}"
      SamlMetadataDocument: !Ref SAMLMetadata
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: SimpleSAMLIdP
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  SAMLProviderArn:
    Description: ARN of the created SAML Provider
    Value: !Ref SAMLProvider
    Export:
      Name: !Sub "${AWS::StackName}-SAMLProviderArn"
