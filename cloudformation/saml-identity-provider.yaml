AWSTemplateFormatVersion: '2010-09-09'
Description: 'SAML Identity Provider - Deploys the IAM SAML Provider trust anchor for Central SAML IdP'

# Stack Name: saml-identity-provider-${Environment}

# DEPLOYMENT INSTRUCTIONS:
# 1. Download the SAML metadata (saml-metadata.xml) from the IdP
# 2. Deploy this stack in target AWS accounts that need to trust the IdP:
#    aws cloudformation deploy \
#      --stack-name saml-identity-provider-dev \
#      --template-file saml-identity-provider.yaml \
#      --parameter-overrides Environment=dev SAMLMetadata="$(cat saml-metadata.xml)" \
#      --capabilities CAPABILITY_IAM

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Configuration"
        Parameters:
          - Environment
          - SAMLMetadata
    ParameterLabels:
      Environment:
        default: "Environment Name"
      SAMLMetadata:
        default: "IDP Metadata XML"

Parameters:
  Environment:
    Type: String
    Description: Environment name (e.g., dev, prod) to be appended to the provider name
    Default: dev
    AllowedPattern: ^[a-zA-Z0-9-]+$
    ConstraintDescription: Must be alphanumeric with hyphens only
    
  SAMLMetadata:
    Type: String
    Description: The XML metadata document from the Simple SAML IdP. Paste the full content of saml-metadata.xml here.
    MinLength: 1

Resources:
  SAMLProvider:
    Type: AWS::IAM::SAMLProvider
    Properties:
      # Provider name follows pattern: CentralSAMLIdP-{Environment}
      Name: !Sub "CentralSAMLIdP-${Environment}"
      SamlMetadataDocument: !Ref SAMLMetadata
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: SimpleSAMLIdP
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  SAMLProviderArn:
    Description: ARN of the created SAML Provider
    Value: !Ref SAMLProvider
    Export:
      Name: !Sub "${AWS::StackName}-SAMLProviderArn"

  SAMLProviderName:
    Description: Name of the created SAML Provider
    Value: !Sub "CentralSAMLIdP-${Environment}"
