# This triggers on all merged PRs into main
#
# IMPORTANT: This workflow uses GitHub Environment Protection Rules for manual approvals.
# See docs/WORKFLOW_APPROVALS.md for configuration instructions.
# Approvals are required before deploying to STG and PROD environments.

name: Main - Deploy

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  pull-requests: write
  contents: read

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    name: "[BUILD]"
    uses: faccomichele/utils-n-scripts/.github/workflows/lambda-build.yml@main
    with:
      working-directory: './lambda'
    secrets: inherit

  dev:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    name: "[DEV]"
    uses: faccomichele/utils-n-scripts/.github/workflows/terraform-run.yml@main
    with:
      environment: 'dev'
      region: 'eu-central-1'
      working-directory: '.'
      action: 'apply'
      download-lambda-artifacts: true
      upload-output-artifact: true
    secrets: inherit

  dev-website:
    needs: dev
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    name: "[DEV-WEBSITE]"
    uses: faccomichele/utils-n-scripts/.github/workflows/deploy-website.yml@main
    with:
      environment: 'dev'
      region: 'eu-central-1'
      working-directory: './website'
    secrets: inherit

  stg-approval:
    needs: [dev-website]
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    name: "[STG-Approval]"
    runs-on: ${{ vars.RUNNERS || 'ubuntu-latest' }}
    # Environment protection rules configured in GitHub settings control approval
    # Configure at: Settings > Environments > stg > Required reviewers
    environment:
      name: stg
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Display approval information
        run: |
          echo "=========================================="
          echo "🔐 STAGING DEPLOYMENT APPROVAL REQUIRED"
          echo "=========================================="
          echo ""
          echo "This workflow is paused pending approval."
          echo "Configured reviewers must approve in GitHub UI."
          echo ""
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Triggered by: ${{ github.actor }}"
          echo ""
          echo "To approve: Go to Actions tab and review this deployment"
          echo "=========================================="

  stg:
    needs: [build, dev, dev-website, stg-approval]
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    name: "[STG]"
    uses: faccomichele/utils-n-scripts/.github/workflows/terraform-run.yml@main
    with:
      environment: 'stg'
      region: 'eu-central-1'
      working-directory: '.'
      action: 'apply'
      download-lambda-artifacts: true
      upload-output-artifact: true
    secrets: inherit

  stg-website:
    needs: stg
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    name: "[STG-WEBSITE]"
    uses: faccomichele/utils-n-scripts/.github/workflows/deploy-website.yml@main
    with:
      environment: 'stg'
      region: 'eu-central-1'
      working-directory: './website'
    secrets: inherit

  prod-approval:
    needs: [stg-website]
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    name: "[PROD-Approval]"
    runs-on: ${{ vars.RUNNERS || 'ubuntu-latest' }}
    # Environment protection rules configured in GitHub settings control approval
    # Configure at: Settings > Environments > prod > Required reviewers
    environment:
      name: prod
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Display approval information
        run: |
          echo "=========================================="
          echo "🔐 PRODUCTION DEPLOYMENT APPROVAL REQUIRED"
          echo "=========================================="
          echo ""
          echo "This workflow is paused pending approval."
          echo "Configured reviewers must approve in GitHub UI."
          echo ""
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Triggered by: ${{ github.actor }}"
          echo ""
          echo "To approve: Go to Actions tab and review this deployment"
          echo "=========================================="

  prod:
    needs: [build, dev, dev-website, stg, stg-website, prod-approval]
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    name: "[PROD]"
    uses: faccomichele/utils-n-scripts/.github/workflows/terraform-run.yml@main
    with:
      environment: 'prod'
      region: 'eu-central-1'
      working-directory: '.'
      action: 'apply'
      download-lambda-artifacts: true
      upload-output-artifact: true
    secrets: inherit

  prod-website:
    needs: prod
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    name: "[PROD-WEBSITE]"
    uses: faccomichele/utils-n-scripts/.github/workflows/deploy-website.yml@main
    with:
      environment: 'prod'
      region: 'eu-central-1'
      working-directory: './website'
    secrets: inherit
